<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Fachada contemporánea con aberturas de aluminio</title>
<desc id="desc">Fachada moderna con puerta corrediza de aluminio negro y ventana blanca sobre muros cálidos.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e2d7"/><stop offset="1" stop-color="#cfc3b4"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8c2c5"/><stop offset=".45" stop-color="#5f7b7e"/><stop offset="1" stop-color="#273e43"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#141817" stop-opacity=".88"/><stop offset=".48" stop-color="#141817" stop-opacity=".45"/><stop offset="1" stop-color="#141817" stop-opacity="0"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7ad9e"/><stop offset="1" stop-color="#817c70"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="20"/></filter>
  <pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M0 20H80M0 59H80" stroke="#fff" stroke-opacity=".055"/></pattern>
</defs>
